<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10254b">
  <title>Lupa Kata Sandi | Rajawali Event Organizer</title>
  <link rel="icon" href="logo-rajawali.jpg">
  <link rel="stylesheet" href="style.css">
  <style>
    .recovery-wrap{min-height:65vh;display:grid;place-items:center;padding:36px 16px}
    .recovery-card{width:min(100%,480px);background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:30px;box-shadow:0 18px 50px rgba(16,37,75,.08)}
    .recovery-brand{text-align:center;margin-bottom:24px}
    .recovery-brand img{width:68px;height:68px;object-fit:contain;margin:0 auto 12px}
    .recovery-eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:#b28a35}
    .recovery-brand h1{font-size:25px;line-height:1.25;margin:8px 0;color:#10254b}
    .recovery-brand p{color:#64748b;font-size:14px;line-height:1.65;margin:0}
    .recovery-form label{display:block;font-size:13px;font-weight:700;color:#24344d;margin-bottom:8px}
    .recovery-form input{box-sizing:border-box;width:100%;margin-top:8px;padding:13px 14px;border:1px solid #d7deea;border-radius:10px;font:inherit;font-size:15px;outline:none}
    .recovery-form input:focus{border-color:#315b9a;box-shadow:0 0 0 3px rgba(49,91,154,.12)}
    .recovery-button{width:100%;margin-top:18px;padding:13px 16px;border:0;border-radius:10px;background:#173967;color:#fff;font-weight:800;font-size:14px;cursor:pointer}
    .recovery-button:disabled{opacity:.6;cursor:not-allowed}
    .recovery-message{min-height:24px;margin:14px 0 0;font-size:13px;line-height:1.6;color:#475569}
    .recovery-back{display:block;text-align:center;margin-top:20px;color:#24518e;font-size:13px;font-weight:700;text-decoration:none}
    .recovery-back:hover{text-decoration:underline}
    @media(max-width:480px){.recovery-card{padding:24px 20px}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="supabase-config.js"></script>
  <script defer src="lupa-password.js"></script>
</head>
<body class="admin-body">
  <main class="recovery-wrap">
    <section class="recovery-card" aria-labelledby="page-title">
      <div class="recovery-brand">
        <img src="logo-rajawali.jpg" alt="Logo Rajawali Event Organizer" onerror="this.style.display='none'">
        <div class="recovery-eyebrow">RAJAWALI EVENT ORGANIZER</div>
        <h1 id="page-title">Lupa Kata Sandi?</h1>
        <p>Masukkan alamat email yang digunakan untuk login Master Admin. Kami akan memproses permintaan tautan pemulihan melalui Supabase.</p>
      </div>
      <form id="forgot-form" class="recovery-form" novalidate>
        <label for="recovery-email">Email Admin</label>
        <input id="recovery-email" name="email" type="email" autocomplete="username" inputmode="email" maxlength="254" required placeholder="nama@email.com">
        <button id="send-link" class="recovery-button" type="submit">Kirim Tautan Pemulihan</button>
        <p id="forgot-message" class="recovery-message" role="status" aria-live="polite"></p>
      </form>
      <a class="recovery-back" href="admin.html">Kembali ke halaman login admin</a>
    </section>
  </main>
  <script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('[data-year]').forEach(el=>el.textContent=new Date().getFullYear());});</script>
</body>
</html>
