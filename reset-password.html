<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1e46">
<title>Password Baru | Rajawali Event Organizer</title>
<link rel="icon" href="logo-rajawali.jpg">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="supabase-config.js"></script>
<script defer src="reset-password.js"></script>
</head>
<body class="admin-body">
<header class="site-header"><div class="container header-inner">
<a class="brand" href="index.html"><img src="logo-rajawali.jpg" alt="Logo Rajawali"><span><b>RAJAWALI</b><small>PEMULIHAN AKUN ADMIN</small></span></a>
<a href="admin.html" class="back-link">Kembali ke Login</a>
</div></header>
<main class="admin-main"><div class="container">
<section class="login-panel">
<div class="login-brand"><img src="logo-rajawali.jpg" alt=""><span class="eyebrow">KEAMANAN AKUN</span><h1>Buat Password Baru</h1><p>Buat password baru untuk akun Master Admin Rajawali.</p></div>
<form id="recovery-form" class="stack-form">
<label>Password Baru<input id="new-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimal 8 karakter"></label>
<label>Ulangi Password Baru<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Ketik ulang password baru"></label>
<button id="save-password" class="btn btn-primary full" type="submit">Simpan Password Baru</button>
<p id="recovery-message" class="form-message" aria-live="polite"></p>
</form>
<p style="text-align:center;margin:16px 0 0"><a href="admin.html" style="color:#24518e;font-weight:700">Kembali ke halaman login admin</a></p>
</section>
</div></main>
<footer class="site-footer"><div class="container footer-inner"><div class="footer-brand"><img src="logo-rajawali.jpg" alt=""><div><b>RAJAWALI EVENT ORGANIZER</b><small>Master Admin</small></div></div><small>© <span data-year></span> Rajawali Event Organizer.</small></div></footer>
</body></html>
